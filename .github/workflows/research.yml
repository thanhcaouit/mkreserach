name: Research

on:
  schedule:
    - cron: "7,27,47 2-14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: smoke kiểm tra hoặc research thật
        type: choice
        options:
          - research
          - smoke
        default: research

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/research.yml/runs?event=schedule&per_page=8" \
            -o /tmp/runs.json || echo '{"workflow_runs":[]}' > /tmp/runs.json
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          try:
              runs = json.load(open("/tmp/runs.json")).get("workflow_runs") or []
          except Exception as exc:
              print(f"Không đọc được lịch sử, vẫn chạy: {exc}")
              runs = []
          now = datetime.now(timezone.utc)
          current = os.environ["RUN_ID"]
          run = True
          for item in runs:
              if str(item.get("id")) == current:
                  continue
              created = datetime.fromisoformat(str(item.get("created_at")).replace("Z", "+00:00"))
              if now - created >= timedelta(minutes=45):
                  continue
              status = item.get("status")
              conclusion = item.get("conclusion")
              if status in {"queued", "in_progress", "waiting", "pending"} or conclusion in {"success", "skipped"}:
                  print(f"Bỏ qua vì run {item.get('id')} lúc {item.get('created_at')} trạng thái {status}/{conclusion}")
                  run = False
                  break
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run={'true' if run else 'false'}\n")
          PY
  run:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mkresearch-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GROQ_MODEL: openai/gpt-oss-120b
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m mkresearch.main ${{ github.event.inputs.mode || 'research' }}
      - name: Commit data
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'smoke')
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Không có thay đổi data"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update research data"
            git push
          fi

  steam:
    needs: [gate, run]
    if: needs.gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'smoke')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mkresearch-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GROQ_MODEL: openai/gpt-oss-120b
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m mkresearch.steam research
      - name: Commit steam data
        if: success()
        run: |
          git fetch origin main
          git merge --ff-only origin/main
          git add data/steam
          if git diff --cached --quiet; then
            echo "Không có thay đổi data/steam"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update steam research data"
            git push origin HEAD:main
          fi
